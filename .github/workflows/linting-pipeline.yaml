name: Linting Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  lint-html:
    name: lint / Lint HTML files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install HTMLHint
        run: |
          npm install --save-dev htmlhint

      - name: Run HTMLHint
        run: /usr/local/bin/npx htmlhint "**/*.html"

  lint-css:
    name: lint / Lint CSS files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
  
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
  
      - name: Install Stylelint
        run: |
          npm install --global stylelint stylelint-config-standard
  
      - name: Run Stylelint
        run: /usr/local/bin/npx stylelint "**/*.css"
